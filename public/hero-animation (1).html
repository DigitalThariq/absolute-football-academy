<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absolute Football Academy — Hero Background</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
  }
  #canvas-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  canvas { display: block; width: 100% !important; height: 100% !important; }

  /* Loading overlay */
  #loading {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 1.2s ease;
  }
  #loading.fade {
    opacity: 0;
    pointer-events: none;
  }
  .loader-ring {
    width: 60px;
    height: 60px;
    border: 3px solid rgba(0,180,255,0.15);
    border-top-color: #00b4ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Optional overlay UI demo */
  #hero-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="loading"><div class="loader-ring"></div></div>
<div id="canvas-container"></div>
<div id="hero-overlay"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ─── Scene Setup ────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020408);
scene.fog = new THREE.FogExp2(0x020c1a, 0.018);

const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 300);
camera.position.set(0, 2.2, 9);
camera.lookAt(0, 1.2, 0);

// ─── Clock & Loop Params ────────────────────────────────────────────────
const clock = new THREE.Clock();
const LOOP_DURATION = 7.0; // seamless loop in seconds
const ORBIT_RADIUS = 0.8;
const ORBIT_SPEED = (Math.PI * 2) / LOOP_DURATION;

// ─── Lighting ───────────────────────────────────────────────────────────
// Ambient deep blue fill
const ambient = new THREE.AmbientLight(0x0a1a2e, 0.6);
scene.add(ambient);

// Main stadium floodlight (back top)
const flood1 = new THREE.DirectionalLight(0x8cc8ff, 2.5);
flood1.position.set(-15, 25, -20);
flood1.castShadow = true;
flood1.shadow.mapSize.set(2048, 2048);
flood1.shadow.camera.near = 1;
flood1.shadow.camera.far = 80;
flood1.shadow.camera.left = -20;
flood1.shadow.camera.right = 20;
flood1.shadow.camera.top = 20;
flood1.shadow.camera.bottom = -20;
flood1.shadow.bias = -0.001;
scene.add(flood1);

// Secondary floodlight
const flood2 = new THREE.DirectionalLight(0x6ab0f0, 1.8);
flood2.position.set(20, 22, -15);
flood2.castShadow = false;
scene.add(flood2);

// Ball neon glow point light
const ballGlow = new THREE.PointLight(0x00cfff, 8, 12, 1.8);
ballGlow.position.set(0, 1.5, 0);
scene.add(ballGlow);

// Ground bounce light
const groundBounce = new THREE.PointLight(0x004488, 3, 8, 2.0);
groundBounce.position.set(0, -0.5, 0);
scene.add(groundBounce);

// Warm rim light from stadium glow
const rimLight = new THREE.PointLight(0x224488, 2.5, 25, 1.5);
rimLight.position.set(0, 8, -18);
scene.add(rimLight);

// ─── Ground / Pitch ─────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(80, 80, 80, 80);

// Procedural wet grass shader
const groundMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor1: { value: new THREE.Color(0x021a08) },
    uColor2: { value: new THREE.Color(0x031e0a) },
    uReflectColor: { value: new THREE.Color(0x00aaff) },
    uBallPos: { value: new THREE.Vector3(0, 0, 0) },
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWorldPos;
    void main() {
      vUv = uv;
      vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uReflectColor;
    uniform vec3 uBallPos;
    varying vec2 vUv;
    varying vec3 vWorldPos;

    float stripe(vec2 uv, float width) {
      return step(0.5, mod(uv.x * 6.0, 1.0)) * step(0.45, 1.0 - step(0.5, mod(uv.x * 6.0, 1.0)) + step(0.5, mod(uv.x * 6.0, 1.0)));
    }

    void main() {
      // Grass stripe pattern
      float s = step(0.5, mod(vUv.x * 10.0, 1.0));
      vec3 base = mix(uColor1, uColor2 * 1.15, s);

      // Distance from ball for reflection pool
      float dist = length(vWorldPos.xz - uBallPos.xz);
      float reflPool = smoothstep(4.0, 0.3, dist);
      float reflPulse = 0.5 + 0.5 * sin(uTime * 1.8 - dist * 2.0);

      // Wet sheen
      float wetness = reflPool * reflPulse * 0.7 + reflPool * 0.3;
      vec3 color = mix(base, uReflectColor * 0.5, wetness);

      // Forward fade for depth
      float fade = smoothstep(0.0, 0.4, vUv.y);
      color *= fade * 0.7 + 0.4;

      gl_FragColor = vec4(color, 1.0);
    }
  `,
  side: THREE.FrontSide,
});

const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Center circle (pitch marking)
const circleGeo = new THREE.RingGeometry(4.95, 5.1, 64);
const circleMat = new THREE.MeshBasicMaterial({ color: 0x0a3a12, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
const circle = new THREE.Mesh(circleGeo, circleMat);
circle.rotation.x = -Math.PI / 2;
circle.position.y = 0.01;
scene.add(circle);

// ─── Football ────────────────────────────────────────────────────────────
// Icosahedron as football base with custom shader
const ballGeo = new THREE.IcosahedronGeometry(0.75, 4);

const ballMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor1: { value: new THREE.Color(0x001122) },
    uColor2: { value: new THREE.Color(0x002244) },
    uNeonColor: { value: new THREE.Color(0x00cfff) },
    uNeonColor2: { value: new THREE.Color(0x0066ff) },
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec2 vUv;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vPosition = position;
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uNeonColor;
    uniform vec3 uNeonColor2;
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec2 vUv;

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p); vec2 f = fract(p);
      float a = hash(i); float b = hash(i + vec2(1,0));
      float c = hash(i + vec2(0,1)); float d = hash(i + vec2(1,1));
      vec2 u = f*f*(3.0-2.0*f);
      return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;
    }

    void main() {
      // Spherical UV
      vec3 n = normalize(vPosition);
      float u = 0.5 + atan(n.z, n.x) / (2.0 * 3.14159);
      float v = 0.5 - asin(n.y) / 3.14159;

      // Circuit grid lines
      float gx = abs(fract(u * 14.0 + uTime * 0.05) - 0.5);
      float gy = abs(fract(v * 14.0) - 0.5);
      float grid = smoothstep(0.48, 0.46, min(gx, gy));

      // Pentagon patches (icosahedron panels)
      float px = abs(fract(u * 5.0) - 0.5);
      float py = abs(fract(v * 5.0) - 0.5);
      float panels = smoothstep(0.47, 0.45, min(px, py));

      // Energy pulse wave
      float pulse = sin(uTime * 2.5 - length(n.xy) * 8.0) * 0.5 + 0.5;
      float energy = smoothstep(0.6, 1.0, pulse) * grid;

      // Fresnel rim glow
      vec3 viewDir = normalize(vec3(0,0,1));
      float fresnel = pow(1.0 - max(dot(vNormal, viewDir), 0.0), 3.0);

      // Compose
      vec3 base = mix(uColor1, uColor2, v + noise(vec2(u*8.0, v*8.0)) * 0.2);
      vec3 neon = mix(uNeonColor2, uNeonColor, sin(uTime*0.7 + u*6.28)*0.5+0.5);

      vec3 col = base;
      col += neon * panels * 1.5;
      col += uNeonColor * grid * 2.0;
      col += uNeonColor * energy * 3.0;
      col += uNeonColor * fresnel * 2.5;

      // Motion blur hint (scanlines)
      float scan = step(0.5, fract(v * 80.0 + uTime * 4.0));
      col += uNeonColor * scan * 0.03;

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});

const ball = new THREE.Mesh(ballGeo, ballMat);
ball.position.set(0, 1.5, 0);
ball.castShadow = true;
scene.add(ball);

// ─── Stadium Structure ───────────────────────────────────────────────────
function makeStadiumWall(x, y, z, rx, ry, rz, w, h) {
  const geo = new THREE.BoxGeometry(w, h, 0.4);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x080e1a,
    metalness: 0.3,
    roughness: 0.85,
    emissive: new THREE.Color(0x001030),
    emissiveIntensity: 0.3,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, rz);
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// Back wall with stands suggestion
makeStadiumWall(0, 9, -28, 0, 0, 0, 70, 18);
makeStadiumWall(-22, 9, -14, 0, Math.PI/3, 0, 40, 16);
makeStadiumWall(22, 9, -14, 0, -Math.PI/3, 0, 40, 16);

// Crowd lights rows on back wall
const crowdLightColors = [0x4488bb, 0x336699, 0x557799, 0x3366aa, 0x4477aa];
for (let row = 0; row < 5; row++) {
  for (let col = 0; col < 24; col++) {
    const lx = -26 + col * 2.2;
    const ly = 4 + row * 2.5;
    const lz = -27.5;
    const lightGeo = new THREE.PlaneGeometry(0.35, 0.35);
    const color = crowdLightColors[Math.floor(Math.random() * crowdLightColors.length)];
    const alpha = 0.3 + Math.random() * 0.5;
    const lightMat = new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: alpha,
    });
    const lightMesh = new THREE.Mesh(lightGeo, lightMat);
    lightMesh.position.set(lx, ly, lz);
    scene.add(lightMesh);
  }
}

// Stadium floodlight towers (back corners)
function makeTower(x, z) {
  const towerGeo = new THREE.BoxGeometry(0.5, 20, 0.5);
  const towerMat = new THREE.MeshStandardMaterial({ color: 0x111820, metalness: 0.6, roughness: 0.5 });
  const tower = new THREE.Mesh(towerGeo, towerMat);
  tower.position.set(x, 10, z);
  scene.add(tower);

  // Floodlight bank
  const bankGeo = new THREE.BoxGeometry(4, 0.4, 1.2);
  const bankMat = new THREE.MeshStandardMaterial({
    color: 0x334455,
    metalness: 0.9,
    roughness: 0.2,
    emissive: 0xaaccff,
    emissiveIntensity: 1.5,
  });
  const bank = new THREE.Mesh(bankGeo, bankMat);
  bank.position.set(x, 20.5, z);
  bank.rotation.x = Math.PI / 6;
  scene.add(bank);

  // Shaft of light (cone mesh)
  const shaftGeo = new THREE.ConeGeometry(0.15, 28, 8, 1, true);
  const shaftMat = new THREE.MeshBasicMaterial({
    color: 0x3388cc,
    transparent: true,
    opacity: 0.04,
    side: THREE.DoubleSide,
  });
  const shaft = new THREE.Mesh(shaftGeo, shaftMat);
  shaft.position.set(x, 6, z + 4);
  shaft.rotation.x = Math.PI / 8;
  scene.add(shaft);
}
makeTower(-18, -22);
makeTower(18, -22);
makeTower(-18, 2);
makeTower(18, 2);

// ─── LED Banner ──────────────────────────────────────────────────────────
// Create canvas texture for the LED banner
const bannerCanvas = document.createElement('canvas');
bannerCanvas.width = 2048;
bannerCanvas.height = 128;
const bctx = bannerCanvas.getContext('2d');

function drawBanner(t) {
  bctx.clearRect(0, 0, 2048, 128);
  // Background
  bctx.fillStyle = '#010a15';
  bctx.fillRect(0, 0, 2048, 128);
  // LED grid dots (subtle)
  bctx.fillStyle = 'rgba(0,60,120,0.3)';
  for (let x = 0; x < 2048; x += 8) {
    for (let y = 0; y < 128; y += 8) {
      bctx.fillRect(x + 2, y + 2, 3, 3);
    }
  }
  // Scrolling text
  const scrollX = ((t * 60) % 2200) - 100;
  bctx.font = 'bold 72px Rajdhani, sans-serif';
  bctx.fillStyle = '#00cfff';
  bctx.shadowColor = '#00aaff';
  bctx.shadowBlur = 18;
  bctx.fillText('ABSOLUTE FOOTBALL ACADEMY', 2048 - scrollX, 90);
  bctx.shadowBlur = 0;
  // Side lines
  bctx.strokeStyle = '#003366';
  bctx.lineWidth = 2;
  bctx.strokeRect(0, 0, 2048, 128);
  bctx.strokeStyle = '#0066aa';
  bctx.lineWidth = 1;
  bctx.strokeRect(4, 4, 2040, 120);
}

drawBanner(0);
const bannerTex = new THREE.CanvasTexture(bannerCanvas);

const bannerGeo = new THREE.BoxGeometry(30, 1.2, 0.1);
const bannerMat = new THREE.MeshBasicMaterial({ map: bannerTex });
const banner = new THREE.Mesh(bannerGeo, bannerMat);
banner.position.set(0, 1.5, -27.4);
scene.add(banner);

// Banner glow
const bannerGlowLight = new THREE.PointLight(0x0066ff, 1.5, 10, 1.5);
bannerGlowLight.position.set(0, 1.5, -26);
scene.add(bannerGlowLight);

// ─── Particle System ─────────────────────────────────────────────────────
const PARTICLE_COUNT = 600;
const particleGeo = new THREE.BufferGeometry();
const pPositions = new Float32Array(PARTICLE_COUNT * 3);
const pVelocities = new Float32Array(PARTICLE_COUNT * 3);
const pPhases = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  pPositions[i*3]   = (Math.random() - 0.5) * 30;
  pPositions[i*3+1] = Math.random() * 15;
  pPositions[i*3+2] = (Math.random() - 0.5) * 20 - 5;
  pVelocities[i*3]   = (Math.random() - 0.5) * 0.008;
  pVelocities[i*3+1] = 0.003 + Math.random() * 0.006;
  pVelocities[i*3+2] = (Math.random() - 0.5) * 0.004;
  pPhases[i] = Math.random() * Math.PI * 2;
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
particleGeo.setAttribute('phase', new THREE.BufferAttribute(pPhases, 1));

const particleMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0x00aaff) } },
  vertexShader: `
    attribute float phase;
    uniform float uTime;
    varying float vAlpha;
    void main() {
      vAlpha = 0.3 + 0.4 * sin(uTime * 1.2 + phase);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = 2.5 * (1.0 - gl_Position.z / gl_Position.w * 0.5);
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    varying float vAlpha;
    void main() {
      float d = distance(gl_PointCoord, vec2(0.5));
      float a = smoothstep(0.5, 0.1, d);
      gl_FragColor = vec4(uColor, a * vAlpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ─── Volumetric Fog Planes ────────────────────────────────────────────────
function makeFogPlane(y, z, opacity) {
  const geo = new THREE.PlaneGeometry(60, 8, 1, 1);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x0a2240,
    transparent: true,
    opacity,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, y, z);
  mesh.rotation.x = Math.PI / 12;
  scene.add(mesh);
  return mesh;
}
const fogPlanes = [
  makeFogPlane(2.5, -8, 0.06),
  makeFogPlane(4, -14, 0.08),
  makeFogPlane(6, -20, 0.1),
];

// ─── Post-Processing ─────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(W, H),
  1.2,   // strength
  0.5,   // radius
  0.55   // threshold
);
composer.addPass(bloom);

// Vignette + color grade shader
const gradePass = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    varying vec2 vUv;
    void main() {
      vec4 col = texture2D(tDiffuse, vUv);
      // Subtle chromatic aberration
      float ab = 0.0012;
      float r = texture2D(tDiffuse, vUv + vec2(ab, 0)).r;
      float b = texture2D(tDiffuse, vUv - vec2(ab, 0)).b;
      col.r = r; col.b = b;
      // Vignette
      vec2 uv2 = vUv * 2.0 - 1.0;
      float vig = 1.0 - dot(uv2 * vec2(0.5, 0.7), uv2 * vec2(0.5, 0.7));
      vig = pow(vig, 1.4);
      col.rgb *= vig;
      // Color grade: push blues, desaturate slightly
      float lum = dot(col.rgb, vec3(0.299, 0.587, 0.114));
      col.rgb = mix(col.rgb, vec3(lum), 0.08);
      col.rgb *= vec3(0.85, 0.95, 1.12);
      gl_FragColor = col;
    }
  `,
});
composer.addPass(gradePass);

// ─── Resize Handler ───────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const nW = window.innerWidth, nH = window.innerHeight;
  camera.aspect = nW / nH;
  camera.updateProjectionMatrix();
  renderer.setSize(nW, nH);
  composer.setSize(nW, nH);
});

// ─── Seamless Loop Animation ──────────────────────────────────────────────
let totalTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  totalTime += delta;

  // Normalized loop time [0..1]
  const lt = (totalTime % LOOP_DURATION) / LOOP_DURATION;
  const t = lt * Math.PI * 2;

  // ── Camera: smooth orbit, seamless loop ──
  const camAngle = t * 0.18; // ~65° of orbit over full loop
  const camX = Math.sin(camAngle) * ORBIT_RADIUS;
  const camZ = 9 - Math.sin(camAngle * 0.5) * 0.4;
  const camY = 2.2 + Math.sin(t * 0.5) * 0.15;
  camera.position.set(camX, camY, camZ);
  camera.lookAt(0, 1.3 + Math.sin(t * 0.4) * 0.05, 0);

  // ── Ball: float + rotate ──
  const floatY = 1.5 + Math.sin(totalTime * 0.9) * 0.15;
  ball.position.y = floatY;
  ball.rotation.y += delta * 0.55;
  ball.rotation.x += delta * 0.22;

  // Update ball glow position
  ballGlow.position.set(0, floatY, 0);
  groundBounce.position.set(0, floatY - 1.8, 0);
  // Pulsing glow
  const glowPulse = 6 + Math.sin(totalTime * 2.2) * 2;
  ballGlow.intensity = glowPulse;

  // ── Shader uniforms ──
  groundMat.uniforms.uTime.value = totalTime;
  groundMat.uniforms.uBallPos.value.set(0, floatY, 0);
  ballMat.uniforms.uTime.value = totalTime;
  particleMat.uniforms.uTime.value = totalTime;
  gradePass.uniforms.uTime.value = totalTime;

  // ── Banner texture update ──
  drawBanner(totalTime);
  bannerTex.needsUpdate = true;
  // Banner glow pulse
  bannerGlowLight.intensity = 1.2 + Math.sin(totalTime * 0.6) * 0.3;

  // ── Particles: drift upward, reset at top ──
  const pos = particleGeo.attributes.position.array;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    pos[i*3]   += pVelocities[i*3];
    pos[i*3+1] += pVelocities[i*3+1];
    pos[i*3+2] += pVelocities[i*3+2];
    if (pos[i*3+1] > 16) {
      pos[i*3+1] = 0;
      pos[i*3] = (Math.random() - 0.5) * 30;
    }
  }
  particleGeo.attributes.position.needsUpdate = true;

  // ── Fog planes: gentle sway ──
  fogPlanes.forEach((fp, i) => {
    fp.position.x = Math.sin(totalTime * 0.2 + i * 1.1) * 2;
    const matFog = fp.material;
    matFog.opacity = (i === 0 ? 0.06 : i === 1 ? 0.08 : 0.1) * (0.8 + 0.2 * Math.sin(totalTime * 0.5 + i));
  });

  // ── Crowd lights twinkle ──

  composer.render();
}

// ─── Start ───────────────────────────────────────────────────────────────
clock.start();
animate();

// Fade out loader
setTimeout(() => {
  const loader = document.getElementById('loading');
  loader.classList.add('fade');
  setTimeout(() => loader.remove(), 1400);
}, 800);
</script>
</body>
